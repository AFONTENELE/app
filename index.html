<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maré em Camocim</title>
    <style>
        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.8s ease;
            background-size: 400% 400%;
            animation: moveGradient 15s ease infinite;
            padding: 20px;
        }

        /* Tema Claro: Azul Piscina */
        body.light-mode { 
            background-image: linear-gradient(-45deg, #e0f7fa, #80deea, #ffffff, #4dd0e1); 
            color: #222; 
        }

        /* Tema Escuro: Roxo Profundo */
        body.dark-mode { 
            background-image: linear-gradient(-45deg, #1a0033, #2e004f, #4b0082, #000000); 
            color: #ffffff; 
        }

        .container { width: 100%; max-width: 450px; text-align: center; }

        .toggle-wrapper { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; gap: 10px; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #bb86fc; }
        input:checked + .slider:before { transform: translateX(22px); }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .info-topo { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .badge-info { background: rgba(0,0,0,0.08); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
        body.dark-mode .badge-info { background: rgba(255,255,255,0.1); }

        .tide-img { width: 100%; max-width: 260px; border-radius: 20px; margin: 15px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: none; }
        
        .status-badge { font-size: 1.4rem; font-weight: bold; display: block; margin-top: 10px; color: #00796b; }
        body.dark-mode .status-badge { color: #bb86fc; }

        .secao-titulo { margin-top: 20px; font-size: 0.8rem; text-align: left; border-bottom: 1px solid rgba(128,128,128,0.3); padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .event-list { text-align: left; margin-top: 8px; }
        .event-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.9rem; border-bottom: 1px solid rgba(128,128,128,0.1); }
    </style>
</head>
<body class="light-mode">
    <div class="container">
        <div class="toggle-wrapper">
            <span id="label-modo">Modo Claro</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <h2 id="saudacao">Olá!</h2>
        <h1>Maré em Camocim</h1>
        
        <div class="card">
            <div class="info-topo">
                <div class="badge-info" id="lua-display">🌑 ...</div>
                <div class="badge-info" id="clima-display">🌡️ ...</div>
            </div>

            <div class="foco-atual">
                <span class="status-badge" id="status-text">Sincronizando...</span>
                <p id="proxima-info" style="font-size: 0.9rem; opacity: 0.8;">--</p>
            </div>

            <img id="mare-imagem" src="" alt="Maré" class="tide-img">

            <div>
                <h4 class="secao-titulo">Hoje</h4>
                <div id="lista-hoje" class="event-list"></div>
            </div>

            <div>
                <h4 class="secao-titulo">Amanhã</h4>
                <div id="lista-amanha" class="event-list"></div>
            </div>
        </div>
    </div>

    <script src="dados.js"></script>
    <script src="app.js"></script>
</body>
</html>
